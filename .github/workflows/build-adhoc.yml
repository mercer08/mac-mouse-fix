name: Build (ad-hoc signed)
on:
  push:
    branches: [ci-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project "Mouse Fix.xcodeproj" -scheme "App - Release" -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" build | tail -200
      - name: Package
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "$APP"
          # Ad-hoc builds can't carry restricted entitlements like keychain-access-groups
          # (AMFI kills the process at launch), so re-sign with only the unrestricted ones.
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.app-sandbox</key><false/></dict></plist>
          PLIST
          sed -i '' 's/^ *//' ent.plist
          codesign -f -s - --entitlements ent.plist "$APP/Contents/Library/LoginItems/Mac Mouse Fix Helper.app"
          codesign -f -s - --entitlements ent.plist "$APP"
          codesign --verify --deep --strict "$APP"
          for x in "$APP" "$APP/Contents/Library/LoginItems/Mac Mouse Fix Helper.app"; do
            echo "== $x"; codesign -d --entitlements - "$x"
            if codesign -d --entitlements - --xml "$x" 2>/dev/null | grep -q keychain-access-groups; then echo "restricted entitlement still present"; exit 1; fi
          done
          ditto -c -k --keepParent "$APP" MacMouseFix.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacMouseFix-adhoc
          path: MacMouseFix.zip
